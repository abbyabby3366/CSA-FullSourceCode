<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application History | Member Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <link rel="stylesheet" href="../assets/css/custom.css" />
    <link rel="stylesheet" href="../assets/css/agent-portal-theme.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Application History</h4>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header border-0 align-items-center d-flex">
                    <h5 class="card-title mb-0 flex-grow-1">
                      Application List
                    </h5>
                    <div class="flex-shrink-0">
                      <div class="input-group">
                        <input
                          type="text"
                          class="form-control"
                          id="customSearch"
                          placeholder="Search application..."
                        />
                        <button class="btn btn-primary" type="button">
                          <i class="ri-search-line"></i> Search
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive table-card">
                      <table
                        class="table table-nowrap align-middle"
                        id="applicationTable"
                      >
                        <thead class="table-light text-muted">
                          <tr>
                            <th>APPLICATION ID</th>
                            <th>DATE & TIME</th>
                            <th>STATUS</th>
                            <th class="text-center">ACTION</th>
                          </tr>
                        </thead>
                        <tbody id="applicationHistory">
                          <tr>
                            <td colspan="4" class="text-center">
                              Loading status...
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">
                © Copyright
                <script>
                  document.write(new Date().getFullYear());
                </script>
                © iBelanja - All rights reserved.
              </div>
              <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                  Design & Develop by Epic Unicorn
                </div>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- jquery js -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>

    <!-- bootstrap js -->
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- utils js -->
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>

    <!-- font js -->
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>

    <!-- datatables js -->
    <script src="../assets/libs/datatables/datatables.min.js"></script>

    <script src="../Scripts/config.js"></script>
    <!-- App js -->
    <script src="../assets/js/app.js"></script>
    <script src="navbar-member.js"></script>
    <script src="memberHelper.js"></script>

    <!-- View Details Modal -->
    <div
      class="modal fade"
      id="viewDetailsModal"
      tabindex="-1"
      aria-labelledby="viewDetailsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="viewDetailsModalLabel">
              Application Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="modalContent">
              <!-- Content will be populated by JS -->
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Re-upload Document Modal -->
    <div
      class="modal fade"
      id="reuploadModal"
      tabindex="-1"
      aria-labelledby="reuploadModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title text-white" id="reuploadModalLabel">
              Update Document
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="reuploadForm">
              <input type="hidden" id="reuploadAppId" />
              <input type="hidden" id="reuploadDocType" value="payslip" />
              <div class="mb-3">
                <label class="form-label font-weight-bold" id="reuploadDocLabel">Select New File (PDF, JPG, PNG, HEIC, DOC)</label>
                <input type="file" class="form-control" id="reuploadFileInput" accept="image/*,.pdf,.doc,.docx,.heic,.heif" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Note / Remark (Optional)</label>
                <input type="text" class="form-control" id="reuploadNoteInput" placeholder="e.g. Updated August payslip" />
              </div>
              <div id="reuploadAlert" class="alert alert-danger d-none"></div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="btnConfirmReupload">
              <span id="reuploadSpinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
              Upload & Submit
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../Scripts/application-components.js"></script>
    <script>
      $(document).ready(function () {
        // Start fetching history immediately
        if (localStorage.getItem("token")) {
          fetchHistory();
        } else {
          $("#applicationHistory").html(
            '<tr><td colspan="5" class="text-center">Please login to view history</td></tr>',
          );
        }

        let applicationData = [];

        async function fetchHistory() {
          try {
            const response = await fetch(
              `${window.API_BASE_URL}/api/applications/my`,
              {
                headers: {
                  "x-auth-token": localStorage.getItem("token"),
                },
              },
            );

            const apps = await response.json();
            applicationData = apps;
            const tbody = $("#applicationHistory");
            tbody.empty();

            if (apps.length === 0) {
              tbody.append(
                '<tr><td colspan="5" class="text-center">No history available</td></tr>',
              );
              return;
            }

            apps.forEach((app) => {
              const d = new Date(app.createDate);
              const day = String(d.getDate()).padStart(2, "0");
              const month = String(d.getMonth() + 1).padStart(2, "0");
              const year = d.getFullYear();
              const hours = String(d.getHours()).padStart(2, "0");
              const minutes = String(d.getMinutes()).padStart(2, "0");
              const date = `${day}/${month}/${year} ${hours}:${minutes}`;

              const statusMap = {
                0: '<span class="badge bg-secondary">Pre-checking</span>',
                1: '<span class="badge bg-info">Pending</span>',
                2: '<span class="badge bg-primary">Proposal Preparation</span>',
                3: '<span class="badge bg-primary">Proposal Presentation</span>',
                4: '<span class="badge bg-secondary">Pre-Signing</span>',
                5: '<span class="badge bg-info">Pending Acceptance</span>',
                6: '<span class="badge bg-success">Approved</span>',
                7: '<span class="badge bg-dark">Monitoring</span>',
                8: '<span class="badge bg-light text-dark">Queue For Reloan</span>',
                9: '<span class="badge bg-primary">Reloan Submission</span>',
                10: '<span class="badge bg-danger">Rejected</span>',
              };
              const status =
                statusMap[app.applicationStatus] ||
                '<span class="badge bg-secondary">Unknown</span>';

              tbody.append(`
                            <tr>
                                <td>${app._id}</td>
                                <td>${date}</td>
                                <td>${status}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-soft-primary view-details" data-id="${app._id}">View Details</button>
                                </td>
                            </tr>
                        `);
            });

            // Initialize DataTable after data is loaded
            $("#applicationTable").DataTable({
              dom: '<"row mx-0"<"col-sm-12 col-md-6"l><"col-sm-12 col-md-6"f>>t<"row mx-0"<"col-sm-12 col-md-6"i><"col-sm-12 col-md-6"p>>',
              destroy: true, // Allow re-initialization
            });

            // Add click handler for View Details
            $(".view-details").on("click", function () {
              const appId = $(this).data("id");
              const app = applicationData.find((a) => a._id === appId);

              if (app) {
                const details = app.details || {};
                const html = AppComponents.renderViewDetailsHTML(app, details, {
                    showReuploadButtons: true,
                    historyPrefix: 'agent'
                });

                $("#modalContent").html(html);
                $("#viewDetailsModal").modal("show");
              }
            });
          } catch (err) {
            console.error("Error fetching history:", err);
            $("#applicationHistory").html(
              '<tr><td colspan="4" class="text-center text-danger">Error loading history.</td></tr>',
            );
          }
        }

        const docTypeLabels = {
          payslip: "Payslip",
          icFront: "IC Front",
          icBack: "IC Back"
        };

        $(document).on("click", ".open-reupload-btn", function () {
          const appId = $(this).data("id");
          const docType = $(this).data("type");
          $("#reuploadAppId").val(appId);
          $("#reuploadDocType").val(docType);
          $("#reuploadFileInput").val("");
          $("#reuploadNoteInput").val("");
          $("#reuploadAlert").addClass("d-none");
          $("#reuploadModalLabel").text("Update " + (docTypeLabels[docType] || docType));
          $("#reuploadModal").modal("show");
        });

        $("#btnConfirmReupload").on("click", async function () {
          const appId = $("#reuploadAppId").val();
          const docType = $("#reuploadDocType").val();
          const fileInput = $("#reuploadFileInput")[0];
          const note = $("#reuploadNoteInput").val();

          if (!fileInput.files || !fileInput.files[0]) {
            $("#reuploadAlert").removeClass("d-none").text("Please select a file to upload.");
            return;
          }

          const formData = new FormData();
          formData.append("document", fileInput.files[0]);
          formData.append("docType", docType);
          formData.append("applicationId", appId);
          formData.append("note", note);

          $("#btnConfirmReupload").prop("disabled", true);
          $("#reuploadSpinner").removeClass("d-none");
          $("#reuploadAlert").addClass("d-none");

          try {
            const response = await fetch(`${window.API_BASE_URL}/api/applications/reupload-document`, {
              method: "POST",
              headers: {
                "x-auth-token": localStorage.getItem("token")
              },
              body: formData
            });

            const resData = await response.json();

            if (!response.ok) {
              throw new Error(resData.msg || "Upload failed");
            }

            $("#reuploadModal").modal("hide");
            $("#viewDetailsModal").modal("hide");

            if (typeof Swal !== "undefined") {
              Swal.fire("Success!", resData.msg || "Document uploaded successfully.", "success");
            } else {
              alert(resData.msg || "Document uploaded successfully.");
            }

            fetchHistory();
          } catch (err) {
            $("#reuploadAlert").removeClass("d-none").text(err.message);
          } finally {
            $("#btnConfirmReupload").prop("disabled", false);
            $("#reuploadSpinner").addClass("d-none");
          }
        });
      });
    </script>
  </body>
</html>

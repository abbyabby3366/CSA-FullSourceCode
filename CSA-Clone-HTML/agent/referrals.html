<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Referral Details | Member Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <link rel="stylesheet" href="../assets/css/custom.css" />
    <link rel="stylesheet" href="../assets/css/agent-portal-theme.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- SweetAlert2 -->
    <link
      rel="stylesheet"
      href="../assets/libs/sweetalert2/sweetalert2.min.css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Referral Details</h4>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title mb-3">Referral Link</h5>
                    <div class="input-group">
                      <input
                        type="text"
                        class="form-control"
                        readonly=""
                        id="refLink"
                        placeholder="Loading referral link..."
                      />
                      <button
                        class="btn btn-outline-primary"
                        type="button"
                        onclick="copyRef()"
                      >
                        <i class="ri-file-copy-line"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header border-0 align-items-center d-flex">
                    <h4 class="card-title mb-0 flex-grow-1">My Referrals</h4>
                    <div class="flex-shrink-0">
                      <div class="input-group">
                        <input
                          type="text"
                          class="form-control"
                          placeholder="Search referrals..."
                          id="searchReferrals"
                        />
                        <button class="btn btn-primary">
                          <i class="ri-search-line"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive table-card">
                      <table
                        class="table table-borderless table-nowrap align-middle mb-0"
                        id="referralsTable"
                      >
                        <thead class="table-light text-muted">
                          <tr>
                            <th scope="col">NO.</th>
                            <th scope="col">REFERRAL NAME</th>
                            <th scope="col">REFERRAL ACCOUNT ID</th>
                            <th scope="col">REGISTRATION DATETIME</th>
                            <th scope="col">APP / DOCUMENT STATUS</th>
                            <th scope="col">ACCOUNT STATUS</th>
                            <th scope="col">REFERRAL AMOUNT</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="7" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                              <p class="mt-2">Loading referrals...</p>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer"></footer>
      </div>
    </div>

    <!-- jquery js -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../Scripts/config.js"></script>

    <!-- bootstrap js -->
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- utils js -->
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>

    <!-- font js -->
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>

    <!-- datatables js -->
    <script src="../assets/libs/datatables/datatables.min.js"></script>

    <!-- App js -->
    <script src="../assets/js/app.js"></script>
    <script src="navbar-member.js"></script>
    <script src="memberHelper.js"></script>

    <!-- SweetAlert2 JS -->
    <script src="../assets/libs/sweetalert2/sweetalert2.all.min.js"></script>

    <script>
      $(document).ready(async function () {
        // Initialize portal and get token
        const member = await initMemberPortal();
        const token = localStorage.getItem("token");

        if (member && token) {
          // Referral Link
          const pathParts = window.location.pathname.split("/");
          pathParts[pathParts.length - 2] = "member";
          const newPath = pathParts.slice(0, -1).join("/");
          const referralUrl =
            window.location.origin +
            newPath +
            "/register.html?ref=" +
            member.memberCode;
          $("#refLink").val(referralUrl);

          try {
            // Fetch referrals from backend
            const response = await fetch(
              `${window.API_BASE_URL}/api/members/referrals`,
              {
                headers: { "x-auth-token": token },
              },
            );

            if (response.ok) {
              const referrals = await response.json();
              const tbody = $("#referralsTable tbody");
              tbody.empty();

              const appStatusMap = {
                0: { text: "Pending (Unassigned)", class: "bg-light text-dark" },
                1: { text: "Pending (Pre-checking)", class: "bg-info" },
                2: { text: "Pending (Proposal Prep)", class: "bg-warning" },
                3: { text: "Pending (Proposal Pres)", class: "bg-primary" },
                4: { text: "Pending (Pre-Signing)", class: "bg-secondary" },
                5: { text: "Pending Acceptance", class: "bg-info" },
                6: { text: "Approved", class: "bg-success" },
                7: { text: "Monitoring", class: "bg-dark" },
                8: { text: "Queue For Reloan", class: "bg-light text-dark" },
                9: { text: "Reloan Submission", class: "bg-primary" },
                10: { text: "Rejected", class: "bg-danger" },
              };

              referrals.forEach((ref, index) => {
                // Format status badge
                let badgeClass = "";
                let statusText = "";
                if (ref.status === 'pending' || ref.status == 1) {
                  badgeClass = "bg-warning";
                  statusText = "Waiting Approval";
                } else if (ref.status === 'approved' || ref.status == 2) {
                  badgeClass = "bg-success";
                  statusText = "Active";
                } else if (ref.status === 'rejected' || ref.status == 3) {
                  badgeClass = "bg-danger";
                  statusText = "Inactive";
                } else {
                  badgeClass = "bg-secondary";
                  statusText = "Unknown";
                }
                const accountStatusHtml = `<span class="badge ${badgeClass}">${statusText}</span>`;

                const appStatus =
                  ref.latestAppStatus !== null && ref.latestAppStatus !== undefined && appStatusMap[ref.latestAppStatus]
                    ? appStatusMap[ref.latestAppStatus]
                    : { text: "No Application", class: "bg-secondary-subtle text-secondary" };

                const appStatusHtml = `<span class="badge ${appStatus.class}">${appStatus.text}</span>`;

                // Format date
                const dateStr = ref.createDate
                  ? new Date(ref.createDate).toLocaleString("en-GB", {
                      day: "2-digit",
                      month: "short",
                      year: "numeric",
                      hour: "2-digit",
                      minute: "2-digit",
                    })
                  : "-";

                const row = `
                                  <tr>
                                      <td>${index + 1}</td>
                                      <td>
                                          <div class="d-flex align-items-center">
                                              <div class="flex-grow-1">
                                                  <h5 class="fs-14 mb-1">${ref.fullName}</h5>
                                                  <p class="text-muted mb-0">${ref.email || ""}</p>
                                              </div>
                                          </div>
                                      </td>
                                      <td><span class="badge badge-soft-primary">${ref.memberCode || "-"}</span></td>
                                      <td data-sort="${ref.createDate || ""}">${dateStr}</td>
                                      <td>${appStatusHtml}</td>
                                      <td>${accountStatusHtml}</td>
                                      <td><span class="text-success fw-bold">RM ${(ref.referralCommission || 0).toFixed(2)}</span></td>
                                  </tr>
                              `;
                tbody.append(row);
              });

              // Initialize DataTables
              const table = $("#referralsTable").DataTable({
                dom: "Brtip", // Removed 'f' (filtering) since we have a custom search box
                buttons: ["copy", "csv", "excel", "pdf", "print"],
                destroy: true,
                order: referrals.length > 0 ? [[3, "desc"]] : [],
                language: {
                  emptyTable: "No referrals found.",
                },
              });

              // Link search box
              $("#searchReferrals").on("keyup", function () {
                table.search(this.value).draw();
              });
            } else {
              $("#referralsTable tbody").append(
                '<tr><td colspan="7" class="text-center text-danger">Failed to fetch referrals. Please try again later.</td></tr>',
              );
            }
          } catch (err) {
            $("#referralsTable tbody").append(
              '<tr><td colspan="7" class="text-center text-danger">Error loading referrals. Please reload the page.</td></tr>',
            );
            console.error("Error loading referrals:", err);
          }
        }
      });

      function copyRef() {
        var copyText = document.getElementById("refLink");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        document.execCommand("copy");

        Swal.fire({
          toast: true,
          position: "top-end",
          icon: "success",
          title: "Referral Link Copied",
          showConfirmButton: false,
          timer: 3000,
          timerProgressBar: true,
        });
      }
    </script>
  </body>
</html>

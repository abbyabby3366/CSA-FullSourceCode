<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Management | Member Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->

  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"

                  <div class="flex-grow-1">

                  </div>

            </div>

            <div class="row">
              <!-- left panel -->

                <div class="card">
                  <div class="card-body">
                    <div class="text-center mb-4">
                      <div
                        class="profile-user position-relative d-inline-block mx-auto mb-3"
                      >

                          src="../assets/images/users/user-dummy-img.jpg"
                          class="rounded-circle avatar-xl img-thumbnail user-profile-image"
                          alt="user-profile-image"
                        />
                        <div
                          class="avatar-xs p-0 rounded-circle profile-photo-edit"
                        >
                          <input
                            id="profile-img-file-input"
                            type="file"
                            class="profile-img-file-input"
                            accept="image/*"
                          />

                            for="profile-img-file-input"
                            class="profile-photo-edit avatar-xs"
                          >
                            <span
                              class="avatar-title rounded-circle bg-light text-body"
                              ><i class="ri-camera-fill"></i
                            ></span>
                          </label>
                        </div>
                      </div>
                      <h5 class="fs-16 mb-1 fullNameDisplay">Member User</h5>
                      <p class="text-muted mb-0">Active Member</p>
                    </div>

                    <div
                      class="nav flex-column nav-pills text-center text-sm-start"
                      id="v-pills-tab"
                      role="tablist"
                      aria-orientation="vertical"
                    >
                      <a
                        class="nav-link active mb-2"
                        id="v-pills-personal-tab"
                        data-bs-toggle="pill"
                        href="#v-pills-personal"
                        role="tab"
                        aria-controls="v-pills-personal"
                        aria-selected="true"
                        ><i class="ri-file-user-line me-2 align-middle"></i
                        >Personal Details</a
                      >
                      <a
                        class="nav-link mb-2"
                        id="v-pills-bank-tab"
                        data-bs-toggle="pill"
                        href="#v-pills-bank"
                        role="tab"
                        aria-controls="v-pills-bank"
                        aria-selected="false"
                        ><i class="ri-bank-line me-2 align-middle"></i>Bank
                        Details</a
                      >
                      <a
                        class="nav-link mb-2"
                        id="v-pills-career-tab"
                        data-bs-toggle="pill"
                        href="#v-pills-career"
                        role="tab"
                        aria-controls="v-pills-career"
                        aria-selected="false"
                        ><i class="ri-briefcase-line me-2 align-middle"></i>Career
                        Details</a
                      >
                      <a
                        class="nav-link mb-2"
                        id="v-pills-password-tab"
                        data-bs-toggle="pill"
                        href="#v-pills-password"
                        role="tab"
                        aria-controls="v-pills-password"
                        aria-selected="false"
                        ><i class="ri-lock-line me-2 align-middle"></i>Change
                        Password</a
                      >
                    </div>
                  </div>
                </div>
              </div>

              <!-- right panel -->
              <div class="col-lg-9">
                <div class="tab-content text-muted" id="v-pills-tabContent">
                  <div
                    class="tab-pane fade show active"
                    id="v-pills-personal"
                    role="tabpanel"
                    aria-labelledby="v-pills-personal-tab"
                  >
                    <div class="card">
                      <div class="card-header align-items-center d-flex">
                        <button
                          type="button"
                          class="btn btn-soft-secondary btn-sm me-2"
                          id="btnCancelPersonal"
                          style="display: none"
                        >
                          Cancel
                        </button>
                        <h5 class="card-title mb-0 flex-grow-1">
                          Personal Details
                        </h5>
                      </div>
                      <div class="card-body">
                        <form action="javascript:void(0);">
                          <div class="row">
                            <div class="col-lg-12 mb-3">
                              <label class="form-label"
                                >Full Name (as per IC / MyKad)</label
                              >
                              <input
                                type="text"
                                class="form-control"
                                id="personalFullName"
                                placeholder="Enter full name as per IC (e.g. including BIN / BINTI / BTE / A/L)"
                                value=""
                              />
                              <div class="form-text text-muted">Please enter your FULL name as per IC (including BIN / BINTI / BTE / A/L).</div>
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Phone Number</label>
                              <div class="input-group">
                                <span class="input-group-text">+60</span>
                                <input
                                  type="text"
                                  class="form-control"
                                  id="personalPhoneNumber"
                                  value=""
                                  disabled
                                />
                              </div>
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Email Address</label>
                              <input
                                type="email"
                                class="form-control"
                                id="personalEmail"
                                value=""
                                placeholder="example@email.com"
                              />
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Gender</label>
                              <select class="form-select" id="genderSelect">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                              </select>
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">NRIC (IC Number)</label>
                              <input
                                type="text"
                                class="form-control"
                                id="icNumberInput"
                                placeholder="900101101234"
                                maxlength="12"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                              />
                            </div>
                            <div class="col-lg-12">
                              <div class="hstack gap-2 justify-content-end">
                                <button
                                  type="submit"
                                  class="btn btn-primary"
                                  id="btnSavePersonal"
                                >
                                  Save Changes
                                </button>
                              </div>
                            </div>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>

                  <div
                    class="tab-pane fade"
                    id="v-pills-bank"
                    role="tabpanel"
                    aria-labelledby="v-pills-bank-tab"
                  >
                    <div class="card">
                      <div class="card-header align-items-center d-flex">
                        <button
                          type="button"
                          class="btn btn-soft-secondary btn-sm me-2"
                          id="btnCancelBank"
                          style="display: none"

                          Cancel
                        </button>
                        <h5 class="card-title mb-0 flex-grow-1">
                          Bank Details
                        </h5>
                      </div>
                      <div class="card-body">
                        <form action="javascript:void(0);">
                          <div class="row">
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Bank Name</label>
                              <select class="form-select select2-bank">
                                <option value="Affin Bank">Affin Bank</option>
                                <option value="Agrobank">Agrobank</option>
                                <option value="Al Rajhi Bank Malaysia">
                                  Al Rajhi Bank Malaysia
                                </option>
                                <option value="Alliance Bank">
                                  Alliance Bank
                                </option>
                                <option value="AmBank">AmBank</option>
                                <option value="Bank Islam">Bank Islam</option>
                                <option value="Bank Muamalat">
                                  Bank Muamalat
                                </option>
                                <option value="Bank Rakyat">Bank Rakyat</option>
                                <option value="BSN">BSN</option>
                                <option value="CIMB">CIMB</option>
                                <option value="Citibank Malaysia">
                                  Citibank Malaysia
                                </option>
                                <option value="GX Bank">GX Bank</option>
                                <option value="Hong Leong Bank">
                                  Hong Leong Bank
                                </option>
                                <option value="HSBC Malaysia">
                                  HSBC Malaysia
                                </option>
                                <option value="Maybank">Maybank</option>
                                <option value="MBSB Bank">MBSB Bank</option>
                                <option value="OCBC Malaysia">
                                  OCBC Malaysia
                                </option>
                                <option value="Public Bank">Public Bank</option>
                                <option value="RHB">RHB</option>
                                <option value="Standard Chartered Malaysia">
                                  Standard Chartered Malaysia
                                </option>
                                <option value="Touch and Go">
                                  Touch and Go
                                </option>
                                <option value="UOB Malaysia">
                                  UOB Malaysia
                                </option>
                              </select>
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label"
                                >Bank Account Name</label
                              >
                              <input
                                type="text"
                                class="form-control"
                                value="Member User"
                              />
                            </div>
                            <div class="col-lg-12 mb-3">
                              <label class="form-label"
                                >Bank Account Number</label
                              >
                              <input
                                type="text"
                                class="form-control numeric-input"
                                id="bankAccNoInp"
                                value="164XXXXXXXXX"
                                inputmode="numeric"
                                pattern="[0-9]*"
                              />
                            </div>
                            <div class="col-lg-12">
                              <div class="hstack gap-2 justify-content-end">
                                <button
                                  type="submit"
                                  class="btn btn-primary"
                                  id="btnSaveBank"
                                >
                                  Save Changes
                                </button>
                              </div>
                            </div>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>

                  <div
                    class="tab-pane fade"
                    id="v-pills-career"
                    role="tabpanel"
                    aria-labelledby="v-pills-career-tab"
                  >
                    <div class="card">
                      <div class="card-header align-items-center d-flex">
                        <button
                          type="button"
                          class="btn btn-soft-secondary btn-sm me-2"
                          id="btnCancelCareer"
                          style="display: none"
                        >
                          Cancel
                        </button>
                        <h5 class="card-title mb-0 flex-grow-1">
                          Career Details
                        </h5>
                      </div>
                      <div class="card-body">
                        <form id="careerDetailsForm" action="javascript:void(0);">
                          <div class="row">
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Working Place / Company Name</label>
                              <input
                                type="text"
                                class="form-control"
                                id="careerCompanyName"
                                placeholder="Company Name"
                              />
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Company Type</label>
                              <select class="form-select" id="careerCompanyType">
                                <option value="1">Government</option>
                                <option value="2">Private</option>
                              </select>
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Occupation</label>
                              <input
                                type="text"
                                class="form-control"
                                id="careerOccupation"
                                placeholder="Occupation"
                              />
                            </div>
                            <div class="col-lg-6 mb-3">
                              <label class="form-label">Monthly Salary (RM)</label>
                              <input
                                type="number"
                                class="form-control numeric-input"
                                id="careerSalary"
                                placeholder="Monthly Salary"
                              />
                            </div>
                             <div class="col-lg-6 mb-3">
                               <label class="form-label">Retirement Age</label>
                               <input
                                 type="number"
                                 class="form-control numeric-input"
                                 id="careerRetirementAge"
                                 placeholder="Retirement Age"
                               />
                             </div>
                             <div class="col-lg-6 mb-3">
                               <label class="form-label">Employment Status</label>
                               <select class="form-select" id="careerEmploymentStatus">

                                 <option value="GOVERNMENT">GOVERNMENT</option>
                                 <option value="GLC">GLC</option>
                                 <option value="SWASTA/ PRIVATE">SWASTA/ PRIVATE</option>
                                 <option value="OWN BUSINESS">OWN BUSINESS</option>
                                 <option value="OTHERS">OTHERS</option>
                               </select>
                             </div>
                             <div class="col-lg-6 mb-3">
                               <label class="form-label">State of Employment</label>
                               <input
                                 type="text"
                                 class="form-control"
                                 id="careerEmploymentState"
                                 placeholder="State of Employment (e.g. Selangor)"
                               />

                              <label class="form-label">Work Address</label>
                              <textarea
                                class="form-control"
                                id="careerWorkAddress"
                                rows="2"
                                placeholder="Work Address"
                              ></textarea>
                            </div>
                            <div class="col-lg-12">
                              <div class="hstack gap-2 justify-content-end">
                                <button
                                  type="submit"
                                  class="btn btn-primary"
                                  id="btnSaveCareer"
                                >
                                  Save Changes
                                </button>

                  <div
                    class="tab-pane fade"
                    id="v-pills-password"
                    role="tabpanel"
                    aria-labelledby="v-pills-password-tab"
                  >
                    <div class="card">
                      <div class="card-header align-items-center d-flex">
                        <button
                          type="button"
                          class="btn btn-soft-secondary btn-sm me-2"
                          id="btnCancelPass"
                          style="display: none"

                          Cancel
                        </button>

                          Change Password
                        </h5>
                      </div>

                        <form action="javascript:void(0);">

                            <div class="col-lg-12 mb-3">
                              <label class="form-label">Current Password</label>
                              <input
                                type="password"

                              />

                                type="password"
                                class="form-control"
                                placeholder="Enter new password"
                              />

                              <label class="form-label"

    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../Scripts/config.js"></script>

    <!-- bootstrap js -->
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- utils js -->
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>

    <!-- font js -->
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>

    <!-- select2 js -->
    <script src="../assets/libs/select2/js/select2.min.js"></script>

    <!-- App js -->
    <script src="../assets/js/app.js"></script>
    <script src="navbar-member.js"></script>
    <script src="memberHelper.js"></script>

    <script>
      $(document).ready(async function () {
        let initialPersonal = {};
        let initialBank = {};
        let initialCareer = {};

        function capturePersonalState() {
          initialPersonal = {
            fullName: $("#personalFullName").val(),
            email: $("#personalEmail").val(),
            gender: $("#genderSelect").val(),
            icNumber: $("#icNumberInput").val(),
          };
          $("#btnCancelPersonal").hide();
        }

        function captureCareerState() {
          initialCareer = {
            companyName: $("#careerCompanyName").val(),
            companyType: $("#careerCompanyType").val(),
            occupation: $("#careerOccupation").val(),
            salary: $("#careerSalary").val(),
            retirementAge: $("#careerRetirementAge").val(),
            employmentStatus: $("#careerEmploymentStatus").val(),
            employmentState: $("#careerEmploymentState").val(),
            workAddress: $("#careerWorkAddress").val(),
          };
          $("#btnCancelCareer").hide();
        }

        function captureBankState() {
          initialBank = {
            bankName: $(".select2-bank option:selected").text(),
            bankAccountName: $('#v-pills-bank input[type="text"]').eq(0).val(),
            bankAccountNumber: $("#bankAccNoInp").val(),
          };
          $("#btnCancelBank").hide();
        }

        function checkPersonalChanges() {
          const current = {
            fullName: $("#personalFullName").val(),
            email: $("#personalEmail").val(),
            gender: $("#genderSelect").val(),
            icNumber: $("#icNumberInput").val(),
          };
          const hasChanged =
            JSON.stringify(current) !== JSON.stringify(initialPersonal);
          $("#btnCancelPersonal").toggle(hasChanged);
        }

        function checkCareerChanges() {
          const current = {
            companyName: $("#careerCompanyName").val(),
            companyType: $("#careerCompanyType").val(),
            occupation: $("#careerOccupation").val(),
            salary: $("#careerSalary").val(),
            retirementAge: $("#careerRetirementAge").val(),
            employmentStatus: $("#careerEmploymentStatus").val(),
            employmentState: $("#careerEmploymentState").val(),
            workAddress: $("#careerWorkAddress").val(),
          };
          const hasChanged =
            JSON.stringify(current) !== JSON.stringify(initialCareer);
          $("#btnCancelCareer").toggle(hasChanged);
        }

        function checkBankChanges() {
          const current = {
            bankName: $(".select2-bank option:selected").text(),
            bankAccountName: $('#v-pills-bank input[type="text"]').eq(0).val(),
            bankAccountNumber: $("#bankAccNoInp").val(),
          };
          const hasChanged =
            JSON.stringify(current) !== JSON.stringify(initialBank);
          $("#btnCancelBank").toggle(hasChanged);
        }

        function checkPassChanges() {
          const hasInput =
            $("#v-pills-password input").filter(function () {
              return $(this).val() !== "";
            }).length > 0;
          $("#btnCancelPass").toggle(hasInput);
        }

        const member = await initMemberPortal();
        if (member) {
          let lastApp = null;
          try {
            const appRes = await fetch(
              `${window.API_BASE_URL}/api/applications/my`,
              {
                headers: { "x-auth-token": localStorage.getItem("token") },
              },
            );
            if (appRes.ok) {
              const apps = await appRes.json();
              if (apps && apps.length > 0) {
                lastApp = apps[0];
              }
            }
          } catch (e) {
            console.error("Error fetching last application:", e);
          }

          const details = lastApp?.details || {};
          const empDetails = details.employmentDetails || {};

          // Populate Personal (prioritize last application sent, fallback to member profile)
          const fullName = details.fullName || member.fullName || "";
          const phoneNumber = details.phoneNumber || member.phoneNumber || "";
          const email = details.email || member.email || "";
          const icNumber = details.icNumber || member.icNumber || "";
          const gender = member.gender || "Male";

          $("#personalFullName").val(fullName);
          $("#personalPhoneNumber").val(
            phoneNumber.replace(/^(\+60|60)/, ""),
          );
          $("#personalEmail").val(email);
          $("#genderSelect").val(gender);
          $("#icNumberInput").val(icNumber.replace(/-/g, ""));

          capturePersonalState();

          // Populate Career (prioritize last application sent, fallback to member profile)
          const companyName =
            empDetails.employerName || member.companyName || "";
          const occupation = empDetails.jobTitle || member.occupation || "";
          let salary = member.salary || "";
          if (!salary && empDetails.salaryRange) {
            if (empDetails.salaryRange === "1") salary = 2500;
            else if (empDetails.salaryRange === "2") salary = 4000;
            else if (empDetails.salaryRange === "3") salary = 6000;
            else salary = empDetails.salaryRange;
          }

          $("#careerCompanyName").val(companyName);
          $("#careerCompanyType").val(member.companyType || "1");
          $("#careerOccupation").val(occupation);
          $("#careerSalary").val(salary);
          $("#careerRetirementAge").val(member.retirementAge || "");
          $("#careerEmploymentStatus").val(empDetails.employmentStatus || member.employmentStatus || "");
          $("#careerEmploymentState").val(empDetails.employmentState || member.employmentState || "");
          $("#careerWorkAddress").val(member.workAddress || "");

          captureCareerState();

          // Populate Bank
          $(".select2-bank")
            .val(member.bankName || "")
            .trigger("change");
          $('#v-pills-bank input[type="text"]')
            .first()
            .val(member.bankAccountName || "");
          $("#bankAccNoInp").val(member.bankAccountNumber || "");

          captureBankState();

          // Left Panel
          $(".card .profile-user img").attr(
            "src",
            member.profileImage
              ? `${window.API_BASE_URL}/` + member.profileImage
              : "../assets/images/users/user-dummy-img.jpg",
          );
          $(".fullNameDisplay").text(fullName || member.fullName);
        }

        $(".select2-bank").select2({
          theme: "bootstrap-5",
        });

        // Listeners for changes
        $("#v-pills-personal input, #genderSelect").on(
          "input change",
          checkPersonalChanges,
        );
        $("#careerCompanyName, #careerCompanyType, #careerOccupation, #careerSalary, #careerRetirementAge, #careerEmploymentStatus, #careerEmploymentState, #careerWorkAddress").on(
          "input change",
          checkCareerChanges,
        );
        $(".select2-bank").on("change", checkBankChanges);
        $("#v-pills-bank input").on("input", checkBankChanges);
        $("#v-pills-password input").on("input", checkPassChanges);

        // Numeric input constraint
        $(document).on("input", ".numeric-input", function () {
          this.value = this.value.replace(/[^0-9]/g, "");
        });

        // Cancel Personal Details
        $("#btnCancelPersonal").click(function () {
          $("#personalFullName").val(initialPersonal.fullName);
          $("#personalEmail").val(initialPersonal.email);
          $("#genderSelect").val(initialPersonal.gender);
          $("#icNumberInput").val(initialPersonal.icNumber);
          $(this).hide();
        });

        // Cancel Career Details
        $("#btnCancelCareer").click(function () {
          $("#careerCompanyName").val(initialCareer.companyName);
          $("#careerCompanyType").val(initialCareer.companyType);
          $("#careerOccupation").val(initialCareer.occupation);
          $("#careerSalary").val(initialCareer.salary);
          $("#careerRetirementAge").val(initialCareer.retirementAge);
          $("#careerEmploymentStatus").val(initialCareer.employmentStatus);
          $("#careerEmploymentState").val(initialCareer.employmentState);
          $("#careerWorkAddress").val(initialCareer.workAddress);
          $(this).hide();
        });

        // Cancel Bank Details
        $("#btnCancelBank").click(function () {
          const bankVal = $(".select2-bank option")
            .filter(function () {
              return $(this).text() === initialBank.bankName;
            })
            .val();
          $(".select2-bank").val(bankVal).trigger("change");
          $('#v-pills-bank input[type="text"]')
            .eq(0)
            .val(initialBank.bankAccountName);
          $("#bankAccNoInp").val(initialBank.bankAccountNumber);
          $(this).hide();
        });

        // Cancel Password Change
        $("#btnCancelPass").click(function () {
          $("#v-pills-password input").val("");
          $(this).hide();
        });

        // Save Personal Details
        $("#btnSavePersonal").click(async function (e) {
          e.preventDefault();
          const fullName = $("#personalFullName").val();
          const email = $('#v-pills-personal input[type="email"]').val();
          const gender = $("#genderSelect").val();
          const icNumber = $("#icNumberInput").val().replace(/-/g, "").trim();

          try {
            const response = await fetch(
              `${window.API_BASE_URL}/api/members/update`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-auth-token": localStorage.getItem("token"),
                },
                body: JSON.stringify({ fullName, email, gender, icNumber }),
              },
            );

            if (response.ok) {
              alert("Personal details updated!");
              capturePersonalState();
            } else {
              alert("Failed to update details.");
            }
          } catch (err) {
            console.error("Error:", err);
          }
        });

        // Save Career Details
        $("#btnSaveCareer").click(async function (e) {
          e.preventDefault();
          const companyName = $("#careerCompanyName").val();
          const companyType = parseInt($("#careerCompanyType").val()) || 1;
          const occupation = $("#careerOccupation").val();
          const salary = parseFloat($("#careerSalary").val()) || null;
          const retirementAge = parseInt($("#careerRetirementAge").val()) || null;
          const employmentStatus = $("#careerEmploymentStatus").val();
          const employmentState = $("#careerEmploymentState").val();
          const workAddress = $("#careerWorkAddress").val();

          try {
            const response = await fetch(
              `${window.API_BASE_URL}/api/members/update`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-auth-token": localStorage.getItem("token"),
                },
                body: JSON.stringify({
                  companyName,
                  companyType,
                  occupation,
                  salary,
                  retirementAge,
                  employmentStatus,
                  employmentState,
                  workAddress,
                }),
              },
            );

            if (response.ok) {
              alert("Career details updated!");
              captureCareerState();
            } else {
              alert("Failed to update career details.");
            }
          } catch (err) {
            console.error("Error:", err);
          }
        });

        // Save Bank Details
        $("#btnSaveBank").click(async function (e) {
          e.preventDefault();
          const bankName = $(".select2-bank option:selected").text();
          const bankAccountName = $('#v-pills-bank input[type="text"]')
            .eq(0)
            .val();
          const bankAccountNumber = $("#bankAccNoInp").val();

          try {
            const response = await fetch(
              `${window.API_BASE_URL}/api/members/update`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-auth-token": localStorage.getItem("token"),
                },
                body: JSON.stringify({
                  bankName,
                  bankAccountName,
                  bankAccountNumber,
                }),
              },
            );

            if (response.ok) {
              alert("Bank details updated!");
              captureBankState();
            } else {
              alert("Failed to update bank details.");
            }
          } catch (err) {
            console.error("Error:", err);
          }
        });
      });
    </script>
  </body>
</html>

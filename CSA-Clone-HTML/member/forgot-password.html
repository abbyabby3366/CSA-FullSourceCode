<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Member Portal</title>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <link rel="stylesheet" href="../assets/css/custom.css" />
    <link rel="stylesheet" href="../assets/css/member-portal-theme.css" />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div
      class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="bg-overlay"></div>

      <div class="auth-page-content">
        <div class="container">
          <div class="row">
            <div class="col-lg-12">
              <div class="text-center mt-sm-3 text-white-50">
                <div>
                  <a href="index.html" class="d-inline-block auth-logo">
                    <img
                      src="../assets/images/logos/yabam-logo-dark.png"
                      alt=""
                      height="100"
                    />
                  </a>
                </div>
              </div>
            </div>
          </div>

          <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
              <div class="card mt-4">
                <div class="card-body p-4">
                  <div class="text-center">
                    <h5 class="text-primary fw-semibold">Forgot Password?</h5>
                    <p class="text-muted">Enter your phone number to receive a WhatsApp OTP</p>
                  </div>

                  <div class="p-2 mt-4">
                    <form id="forgotPassForm">
                      <div class="mb-3">
                        <label for="phoneNo" class="form-label">Phone No</label>
                        <div class="input-group">
                          <span class="input-group-text bg-light border-light text-muted">+60</span>
                          <input
                            type="text"
                            class="form-control"
                            id="phoneNo"
                            placeholder="Enter phone number (e.g. 123333444)"
                            required
                          />
                          <button class="btn btn-outline-primary" type="button" id="sendOtpBtn">Send Code</button>
                        </div>
                        <p class="text-muted fs-11 mt-1">
                          Format: (+60)123333444
                        </p>
                      </div>

                      <div id="otpSection" style="display: none;">
                        <div class="mb-3">
                          <label for="tacCode" class="form-label">WhatsApp OTP (TAC)</label>
                          <input type="text" class="form-control" id="tacCode" placeholder="Enter 6-digit code" maxlength="6" />
                        </div>

                        <div class="mb-3">
                          <label for="newPassword" class="form-label">New Password</label>
                          <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" />
                        </div>

                        <div class="mb-3">
                          <label for="confirmPassword" class="form-label">Confirm New Password</label>
                          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" />
                        </div>

                        <div class="mt-4">
                          <button class="btn btn-tertiary w-100" type="submit">
                            Reset Password
                          </button>
                        </div>
                      </div>

                      <div class="mt-4 text-center">
                        <p class="mb-0 text-muted">
                          Remember your password?
                          <a href="index.html" class="fw-semibold text-primary text-decoration-underline">Sign in here</a>
                        </p>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="footer">
        <div class="container">
          <div class="row">
            <div class="col-lg-12">
              <div class="text-center">
                <p class="mb-0 text-white">
                  &copy;
                  <script>
                    document.write(new Date().getFullYear());
                  </script>
                  iBelanja. All rights reserved.
                </p>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="../Scripts/config.js"></script>
    <script>
      $(document).ready(function () {
        let memberPhone = "";

        $("#sendOtpBtn").on("click", async function () {
          let phoneNumber = $("#phoneNo").val();
          if (!phoneNumber) {
            alert("Please enter your phone number");
            return;
          }

          // Format phone with +60 prefix
          phoneNumber = phoneNumber.startsWith("0")
            ? "6" + phoneNumber
            : phoneNumber.startsWith("60")
              ? phoneNumber
              : "60" + phoneNumber;

          $(this).prop("disabled", true).text("Sending...");

          try {
            const response = await fetch(`${window.API_BASE_URL}/api/auth/member/forgot-password`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phoneNumber }),
            });

            const data = await response.json();

            if (response.ok) {
              alert(data.msg);
              memberPhone = phoneNumber;
              $("#otpSection").slideDown();
              $("#phoneNo").prop("readonly", true);
              $(this).text("Resend Code");
              
              // Countdown for resend
              let timeLeft = 60;
              const timer = setInterval(() => {
                if (timeLeft <= 0) {
                  clearInterval(timer);
                  $("#sendOtpBtn").prop("disabled", false).text("Resend Code");
                } else {
                  $("#sendOtpBtn").text(`Resend in ${timeLeft}s`);
                  timeLeft--;
                }
              }, 1000);

            } else {
              alert(data.msg || "Failed to send code");
              $(this).prop("disabled", false).text("Send Code");
            }
          } catch (err) {
            console.error("Error:", err);
            alert("Server error. Make sure the backend is running.");
            $(this).prop("disabled", false).text("Send Code");
          }
        });

        $("#forgotPassForm").on("submit", async function (e) {
          e.preventDefault();
          const tacCode = $("#tacCode").val();
          const newPassword = $("#newPassword").val();
          const confirmPassword = $("#confirmPassword").val();

          if (!tacCode || !newPassword || !confirmPassword) {
            alert("Please fill in all fields");
            return;
          }

          if (newPassword !== confirmPassword) {
            alert("Passwords do not match");
            return;
          }

          try {
            const response = await fetch(`${window.API_BASE_URL}/api/auth/member/reset-password`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phoneNumber: memberPhone, tacCode, newPassword }),
            });

            const data = await response.json();

            if (response.ok) {
              alert(data.msg);
              window.location.href = "index.html";
            } else {
              alert(data.msg || "Reset failed");
            }
          } catch (err) {
            console.error("Error:", err);
            alert("Server error. Make sure the backend is running.");
          }
        });
      });
    </script>
  </body>
</html>

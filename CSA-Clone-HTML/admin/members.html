<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member List | iBelanja Admin</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Member List</h4>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header">
                    <div class="row px-2 gy-2">
                      <div class="col-md-3 col-sm-12 d-flex align-items-center">
                        <h5 class="m-0 p-0"></h5>
                      </div>
                      <div class="col-md-9 col-sm-12">
                        <div class="row justify-content-end gy-3">
                          <div class="col-md-3 col-sm-12">
                            <select class="form-select" id="filterMemberScope">
                              <option value="all">All Members</option>
                              <option value="assigned_subadmin">Assigned to Subadmin</option>
                              <option value="no_agent">No Agent / Direct (Unassigned)</option>
                            </select>
                          </div>
                          <div class="col-md-3 col-sm-12">
                            <div class="input-group">
                              <input
                                type="text"
                                class="form-control"
                                id="txtSearch"
                                placeholder="Search"
                              />
                              <button
                                type="button"
                                class="btn btn-primary btn-label ms-auto"
                                id="btnSearch"
                              >
                                <i
                                  class="ri-search-line label-icon align-middle fs-16 me-2"
                                ></i>
                                Search
                              </button>
                            </div>
                          </div>
                          <div class="col-md-3 col-sm-12">
                            <button
                              id="btnExportCSV"
                              class="btn btn-soft-success waves-effect waves-light w-100"
                            >
                              <i class="ri-download-2-line align-middle me-1"></i> Export CSV
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive">
                      <table
                        id="gvData"
                        class="table nowrap align-middle"
                        style="width: 100%"
                      >
                        <thead class="table-light text-muted">
                          <tr>
                            <th>NO</th>
                            <th>FILE NUMBER</th>
                            <th>FULL NAME</th>
                            <th>IC</th>
                            <th>CONTACT NO</th>
                            <th>SALARY RANGE</th>
                            <th>REFERRAL NAME</th>
                            <th>ASSIGNED SUBADMIN</th>
                            <th>STATUS</th>
                            <th>ACTION</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="11" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer"></footer>
      </div>
    </div>

    <!-- jquery js -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>

    <!-- bootstrap js -->
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- utils js -->
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>

    <!-- font js -->
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>

    <!-- datatables js -->
    <script src="../assets/libs/datatables/datatables.min.js"></script>

    <!-- App js -->
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>

    <script>
      $(document).ready(async function () {
        // Export CSV Handler - Open Modal
        $("#btnExportCSV").on("click", function () {
          $("#exportColumnsModal").modal("show");
        });

        $("#btnExportSelectAll").on("click", function () {
          $(".export-col-chk").prop("checked", true);
        });

        $("#btnExportDeselectAll").on("click", function () {
          $(".export-col-chk").prop("checked", false);
        });

        // Confirm & Download CSV Export
        $("#btnConfirmExport").on("click", async function () {
          const selectedCols = [];
          $(".export-col-chk:checked").each(function () {
            selectedCols.push($(this).val());
          });

          if (selectedCols.length === 0) {
            alert("Please select at least one column to export.");
            return;
          }

          try {
            const token = localStorage.getItem("token");
            let exportUrl = window.API_BASE_URL + "/api/admin/members/export?columns=" + encodeURIComponent(selectedCols.join(","));

            const response = await fetch(exportUrl, {
              method: "GET",
              headers: {
                "x-auth-token": token,
              },
            });

            if (!response.ok) {
              throw new Error("Failed to export data");
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "members_export.csv";
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            $("#exportColumnsModal").modal("hide");
          } catch (err) {
            console.error("Export Error:", err);
            alert("Error exporting member details: " + err.message);
          }
        });

        const appStatusMap = {
          0: { text: "Pending (Unassigned)", class: "bg-light text-dark" },
          1: { text: "Pending (Pre-checking)", class: "bg-info" },
          2: { text: "Pending (Proposal Prep)", class: "bg-warning" },
          3: { text: "Pending (Proposal Pres)", class: "bg-primary" },
          4: { text: "Pending (Pre-Signing)", class: "bg-secondary" },
          5: { text: "Pending Acceptance", class: "bg-info" },
          6: { text: "Approved", class: "bg-success" },
          7: { text: "Monitoring", class: "bg-dark" },
          8: { text: "Queue For Reloan", class: "bg-light text-dark" },
          9: { text: "Reloan Submission", class: "bg-primary" },
          10: { text: "Rejected", class: "bg-danger" },
        };

        async function loadMembers(filter = "all") {
          let url = "/admin/members";
          if (filter !== "all") {
            url += `?filter=${filter}`;
          }

          // Destroy DataTable FIRST, then clear tbody (order matters!)
          if ($.fn.DataTable.isDataTable("#gvData")) {
            $("#gvData").DataTable().destroy();
          }
          const tbody = $("#gvData tbody");
          tbody.empty();
          tbody.append('<tr><td colspan="10" class="text-center"><div class="spinner-border text-primary" role="status"></div></td></tr>');

          const members = await apiCall(url);
          tbody.empty();

          if (members && members.length > 0) {
            let count = 1;
            members.forEach((member) => {
              if (member.memberType === 2) return; // Skip Agents

              const appStatus = member.latestAppStatus !== null && appStatusMap[member.latestAppStatus]
                ? appStatusMap[member.latestAppStatus]
                : { text: "No Application", class: "bg-secondary-subtle text-secondary" };

              let subadminName = "Unassigned";
              if (member.referrer && member.referrer.subadmin && member.referrer.subadmin.name) {
                subadminName = member.referrer.subadmin.name;
              }

              const subadminBadge = subadminName !== "Unassigned"
                ? `<span class="badge bg-info-subtle text-info fs-12 px-2 py-1">${subadminName}</span>`
                : `<span class="badge bg-light text-muted fs-12 px-2 py-1">Unassigned</span>`;

              const rawIc = (member.icNumber || "").toString().replace(/-/g, "").trim();
              const formattedIc = rawIc && rawIc.length === 12 ? `${rawIc.substring(0, 6)}-${rawIc.substring(6, 8)}-${rawIc.substring(8)}` : rawIc;
              const allIcsStr = member.allIcNumbers ? member.allIcNumbers.join(" ") : rawIc;
              const icCell = rawIc
                ? `<span>${formattedIc}</span><span class="d-none">${rawIc} ${allIcsStr}</span>`
                : "N/A";

              tbody.append(`
                          <tr>
                              <td>${count++}</td>
                              <td>${member.memberCode || "N/A"}</td>
                              <td>${member.fullName}</td>
                              <td>${icCell}</td>
                              <td>${member.phoneNumber}</td>
                              <td>${member.salary || "N/A"}</td>
                              <td>${member.referrer ? `${member.referrer.fullName} (${member.referrer.memberCode})` : "N/A"}</td>
                              <td>${subadminBadge}</td>
                              <td>
                                  <span class="badge ${appStatus.class}">${appStatus.text}</span>
                              </td>
                              <td class="text-center">
                                  <div class="hstack gap-2 justify-content-center">
                                      <button class="btn btn-sm btn-soft-info" onclick="viewMember('${member._id}')">View</button>
                                  </div>
                              </td>
                          </tr>
                      `);
            });

            const memberTable = $("#gvData").DataTable({
              scrollX: true
            });

            $("#txtSearch").off("keyup input").on("keyup input", function () {
              memberTable.search($(this).val()).draw();
            });
            $("#btnSearch").off("click").on("click", function () {
              memberTable.search($("#txtSearch").val()).draw();
            });
          } else {
            tbody.append('<tr><td colspan="10" class="text-center">No members found</td></tr>');
          }
        }

        // Hide admin-only controls for subadmins
        const currentUserRole = localStorage.getItem("userRole");
        if (currentUserRole === "subadmin") {
          $("#filterMemberScope").closest(".col-md-3").hide();
          $("#btnExportCSV").closest(".col-md-3").hide();
        }

        // Initial Load
        loadMembers();

        // Handle Filter Dropdown Change
        $("#filterMemberScope").on("change", function () {
          const filterVal = $(this).val();
          loadMembers(filterVal);
        });
      });

      async function viewMember(id) {
        window.location.href = `member-details.html?id=${id}`;
      }


    </script>

    <!-- Export Columns Modal -->
    <div class="modal fade" id="exportColumnsModal" tabindex="-1" aria-labelledby="exportColumnsModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-light">
            <h5 class="modal-title" id="exportColumnsModalLabel">
              <i class="ri-download-2-line align-middle me-1"></i> Select Columns to Export
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <p class="text-muted mb-0">Choose which data fields to include in your CSV export:</p>
              <div>
                <button type="button" class="btn btn-sm btn-outline-primary me-1" id="btnExportSelectAll">Select All</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="btnExportDeselectAll">Deselect All</button>
              </div>
            </div>
            <div class="row gy-2 text-start">
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="subadmin" id="chk_subadmin" checked />
                  <label class="form-check-label" for="chk_subadmin">Subadmin</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="referral_name" id="chk_referral_name" checked />
                  <label class="form-check-label" for="chk_referral_name">Referral Name</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="full_name" id="chk_full_name" checked />
                  <label class="form-check-label" for="chk_full_name">Full Name (Participant)</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="ic" id="chk_ic" checked />
                  <label class="form-check-label" for="chk_ic">IC</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="contact_no" id="chk_contact_no" checked />
                  <label class="form-check-label" for="chk_contact_no">Contact No</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="employment_status" id="chk_employment_status" checked />
                  <label class="form-check-label" for="chk_employment_status">Employment Status</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="company_name" id="chk_company_name" checked />
                  <label class="form-check-label" for="chk_company_name">Company Name</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="job_title" id="chk_job_title" checked />
                  <label class="form-check-label" for="chk_job_title">Occupation / Job Title</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="state_of_employment" id="chk_state_of_employment" checked />
                  <label class="form-check-label" for="chk_state_of_employment">State of Employment</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="ic_front_url" id="chk_ic_front_url" checked />
                  <label class="form-check-label" for="chk_ic_front_url">Application IC Front URL</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="ic_back_url" id="chk_ic_back_url" checked />
                  <label class="form-check-label" for="chk_ic_back_url">Application IC Back URL</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="payslip_url" id="chk_payslip_url" checked />
                  <label class="form-check-label" for="chk_payslip_url">Application Payslip URL</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="join_date" id="chk_join_date" checked />
                  <label class="form-check-label" for="chk_join_date">Join Date</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="bank_name" id="chk_bank_name" checked />
                  <label class="form-check-label" for="chk_bank_name">Bank Name</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="bank_account_name" id="chk_bank_account_name" checked />
                  <label class="form-check-label" for="chk_bank_account_name">Bank Account Name</label>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="form-check">
                  <input class="form-check-input export-col-chk" type="checkbox" value="bank_account_number" id="chk_bank_account_number" checked />
                  <label class="form-check-label" for="chk_bank_account_number">Bank Account Number</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="btnConfirmExport">
              <i class="ri-download-2-line align-middle me-1"></i> Download CSV
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

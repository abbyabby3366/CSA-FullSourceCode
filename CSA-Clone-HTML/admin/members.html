<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member List | CSA Admin</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Member List</h4>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header">
                    <div class="row px-2 gy-2">
                      <div class="col-md-3 col-sm-12 d-flex align-items-center">
                        <h5 class="m-0 p-0"></h5>
                      </div>
                      <div class="col-md-9 col-sm-12">
                        <div class="row justify-content-end gy-3">
                          <div class="col-md-3 col-sm-12">
                            <div class="input-group">
                              <input
                                type="text"
                                class="form-control"
                                id="txtSearch"
                                placeholder="Search"
                              />
                              <button
                                type="button"
                                class="btn btn-primary btn-label ms-auto"
                                id="btnSearch"
                              >
                                <i
                                  class="ri-search-line label-icon align-middle fs-16 me-2"
                                ></i>
                                Search
                              </button>
                            </div>
                          </div>
                          <div class="col-md-3 col-sm-12">
                            <button
                              class="btn btn-soft-primary waves-effect waves-light w-100"
                            >
                              Add New Member
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <table
                      id="gvData"
                      class="table dt-responsive nowrap align-middle"
                      style="width: 100%"
                    >
                      <thead class="table-light text-muted">
                        <tr>
                          <th>NO</th>
                          <th>FILE NUMBER</th>
                          <th>FULL NAME</th>
                          <th>IC</th>
                          <th>CONTACT NO</th>
                          <th>SALARY RANGE</th>
                          <th>REFERRAL NAME</th>
                          <th>STATUS</th>
                          <th>ACTION</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="11" class="text-center">
                            <div
                              class="spinner-border text-primary"
                              role="status"
                            >
                              <span class="visually-hidden">Loading...</span>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">
                Copyright
                <script>
                  document.write(new Date().getFullYear());
                </script>
                © CSA Academy - All right reserved.
              </div>
              <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                  Design & Develop by Epic Unicorn
                </div>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- jquery js -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>

    <!-- bootstrap js -->
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- utils js -->
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>

    <!-- font js -->
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>

    <!-- datatables js -->
    <script src="../assets/libs/datatables/datatables.min.js"></script>

    <!-- App js -->
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>

    <script>
      $(document).ready(async function () {
        const members = await apiCall("/admin/members");
        if (members) {
          const tbody = $("#gvData tbody");
          tbody.empty();
          let count = 1;
          members.forEach((member) => {
            if (member.memberType === 2) return; // Skip Agents

            tbody.append(`
                        <tr>
                            <td>${count++}</td>
                            <td>${member.memberCode || "N/A"}</td>
                            <td>${member.firstName} ${member.lastName}</td>
                            <td>${member.icNumber || "N/A"}</td>
                            <td>${member.phoneNumber}</td>
                            <td>${member.salary || "N/A"}</td>
                            <td>${member.referrer ? `${member.referrer.firstName} ${member.referrer.lastName} (${member.referrer.memberCode})` : "N/A"}</td>
                            <td>
                                ${
                                  member.isApproved
                                    ? '<span class="badge bg-success">Approved</span>'
                                    : '<span class="badge bg-warning text-dark">Pending</span>'
                                }
                            </td>
                            <td class="text-center">
                                <div class="hstack gap-2 justify-content-center">
                                    <button class="btn btn-sm btn-soft-info" onclick="viewMember('${member._id}')">View</button>
                                    ${
                                      member.status === 1
                                        ? `<button class="btn btn-sm btn-soft-success" onclick="approveMember('${member._id}')">Approve</button>
                                           <button class="btn btn-sm btn-soft-danger" onclick="rejectMember('${member._id}')">Reject</button>`
                                        : ""
                                    }
                                </div>
                            </td>
                        </tr>
                    `);
          });
          $("#gvData").DataTable();
        }
      });

      async function viewMember(id) {
        window.location.href = `member-details.html?id=${id}`;
      }

      async function approveMember(id) {
        if (confirm("Are you sure you want to approve this member?")) {
          try {
            const res = await apiCall(`/admin/member/${id}/status`, "POST", {
              status: 2,
            });
            if (res) {
              alert("Member approved successfully");
              location.reload();
            }
          } catch (err) {
            alert("Error approving member");
          }
        }
      }

      async function rejectMember(id) {
        if (confirm("Are you sure you want to reject this member?")) {
          try {
            const res = await apiCall(`/admin/member/${id}/status`, "POST", {
              status: 3,
            });
            if (res) {
              alert("Member rejected successfully");
              location.reload();
            }
          } catch (err) {
            alert("Error rejecting member");
          }
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Withdrawal Requests | iBelanja Admin</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Withdrawal Requests</h4>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header">
                    <div class="row px-2 gy-2">
                      <div class="col-md-3 col-sm-12 d-flex align-items-center">
                        <h5 class="m-0 p-0">Withdrawal Requests List</h5>
                      </div>
                      <div class="col-md-9 col-sm-12">
                        <div class="row justify-content-end gy-3">
                          <div class="col-md-3 col-sm-12">
                            <div class="input-group">
                              <input
                                type="text"
                                class="form-control"
                                id="txtSearch"
                                placeholder="Search"
                              />
                              <button
                                type="button"
                                class="btn btn-primary btn-label ms-auto"
                                id="btnSearch"
                              >
                                <i
                                  class="ri-search-line label-icon align-middle fs-16 me-2"
                                ></i>
                                Search
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive">
                      <table
                        id="gvWithdraw"
                        class="table nowrap align-middle"
                        style="width: 100%"
                      >
                        <thead class="table-light text-muted">
                          <tr>
                            <th>DATETIME OF REQUEST</th>
                            <th>MEMBER</th>
                            <th>BANK ACCOUNT</th>
                            <th>TRANSACTION AMOUNT</th>
                            <th>STATUS</th>
                            <th>RECEIPT</th>
                            <th class="text-center">ACTION</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="7" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Approval Modal -->
        <div
          class="modal fade"
          id="approvalModal"
          tabindex="-1"
          aria-labelledby="approvalModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="approvalModalLabel">
                  Approve Withdrawal
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <form id="approvalForm">
                <div class="modal-body">
                  <input type="hidden" id="withdrawId" name="withdrawId" />
                  <div class="mb-3">
                    <label class="form-label">Upload Receipt (Optional)</label>
                    <input
                      type="file"
                      class="form-control"
                      name="receipt"
                      id="receiptFile"
                      accept="image/*,application/pdf"
                    />
                    <small class="text-muted"
                      >Max file size: 50MB. Allowed: Images, PDF</small
                    >
                  </div>
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-light"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button
                    type="submit"
                    class="btn btn-success"
                    id="btnApproveSubmit"
                  >
                    <span
                      class="spinner-border spinner-border-sm d-none"
                      role="status"
                      aria-hidden="true"
                    ></span>
                    Confirm Approval
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">
                Copyright
                <script>
                  document.write(new Date().getFullYear());
                </script>
                © iBelanja - All right reserved.
              </div>
              <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                  Design & Develop by Epic Unicorn
                </div>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- jquery js -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>

    <!-- bootstrap js -->
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- utils js -->
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>

    <!-- font js -->
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>

    <!-- datatables js -->
    <script src="../assets/libs/datatables/datatables.min.js"></script>

    <!-- App js -->
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>

    <script>
      $(document).ready(function () {
        loadWithdrawals();
      });

      async function loadWithdrawals() {
        try {
          const withdrawals = await apiCall("/admin/withdrawals");
          if (!withdrawals) return;

          const tbody = $("#gvWithdraw tbody");
          tbody.empty();

          withdrawals.forEach((w, index) => {
            const d = new Date(w.createDate);
            const date =
              d.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
              }) +
              " " +
              d.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
              });

            let memberInfo = "Unknown";
            if (w.member) {
              const typeMap = { 1: "Member", 2: "Agent", 3: "Hero" };
              const typeLabel = typeMap[w.member.memberType] || "Member";
              memberInfo = `[${w.member.memberCode || "-"}] ${w.member.fullName} (${typeLabel})`;
            }

            let bankInfo = "-";
            if (w.member) {
              bankInfo = `
                <div class="fs-12">
                  <div class="fw-medium">${w.member.bankName || "-"}</div>
                  <div>${w.member.bankAccountNumber || "-"}</div>
                  <div class="text-muted">${w.member.bankAccountName || "-"}</div>
                </div>
              `;
            }

            const amount = Math.abs(w.amount).toLocaleString(undefined, {
              minimumFractionDigits: 2,
            });

            let statusBadge = "";
            switch (w.status) {
              case "Pending":
                statusBadge = '<span class="badge bg-warning">PENDING</span>';
                break;
              case "Completed":
                statusBadge = '<span class="badge bg-success">PAID</span>';
                break;
              case "Rejected":
                statusBadge = '<span class="badge bg-danger">CANCELLED</span>';
                break;
              default:
                statusBadge = `<span class="badge bg-secondary">${w.status}</span>`;
            }

            let receiptBtn = "-";
            if (w.receiptUrl) {
              receiptBtn = `<a href="${w.receiptUrl}" target="_blank" class="btn btn-sm btn-soft-primary">View</a>`;
            }

            let actions = "";
            if (w.status === "Pending") {
              actions = `
                            <div class="hstack gap-3 fs-13 justify-content-center">
                                <a href="javascript:void(0);" class="text-success" onclick="openApprovalModal('${w._id}')">Approve</a>
                                <a href="javascript:void(0);" class="text-danger" onclick="updateStatus('${w._id}', 'Rejected')">Cancel</a>
                            </div>
                        `;
            } else {
              actions = '<span class="text-muted">No Actions</span>';
            }

            const row = `
                        <tr>
                            <td>${date}</td>
                            <td>${memberInfo}</td>
                            <td>${bankInfo}</td>
                            <td>RM ${amount}</td>
                            <td>${statusBadge}</td>
                            <td class="text-center">${receiptBtn}</td>
                            <td class="text-center">${actions}</td>
                        </tr>
                    `;
            tbody.append(row);
          });

          if ($.fn.DataTable.isDataTable("#gvWithdraw")) {
            $("#gvWithdraw").DataTable().destroy();
          }

          $("#gvWithdraw").DataTable({
            order: [[0, "desc"]],
            responsive: false,
          });
        } catch (err) {
          console.error("Error loading withdrawals:", err);
        }
      }

      function openApprovalModal(id) {
        $("#withdrawId").val(id);
        $("#receiptFile").val("");
        $("#approvalModal").modal("show");
      }

      $("#approvalForm").on("submit", async function (e) {
        e.preventDefault();
        const id = $("#withdrawId").val();
        const formData = new FormData(this);
        formData.append("status", "Completed");

        const btn = $("#btnApproveSubmit");
        const spinner = btn.find(".spinner-border");

        btn.prop("disabled", true);
        spinner.removeClass("d-none");

        try {
          const response = await fetch(
            `${window.API_BASE_URL}/api/admin/withdrawal/${id}/status`,
            {
              method: "POST",
              headers: {
                "x-auth-token": localStorage.getItem("token"),
              },
              body: formData,
            },
          );

          if (response.ok) {
            $("#approvalModal").modal("hide");
            window.location.reload();
          } else {
            const data = await response.json();
            alert(data.msg || "Approval failed");
          }
        } catch (err) {
          console.error("Approval Error:", err);
          alert("An error occurred during approval");
        } finally {
          btn.prop("disabled", false);
          spinner.addClass("d-none");
        }
      });

      async function updateStatus(id, status) {
        const actionText = status === "Completed" ? "mark as Paid" : "Cancel";
        if (!confirm(`Are you sure you want to ${actionText} this request?`))
          return;

        try {
          const result = await apiCall(
            `/admin/withdrawal/${id}/status`,
            "POST",
            { status },
          );
          if (result) {
            window.location.reload();
          }
        } catch (err) {
          console.error("Error updating status:", err);
          alert("Server error");
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent List | Admin Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Agent List</h4>
                  </div>
                  <div class="mt-3 mt-lg-0">
                    <button type="button" class="btn btn-primary">
                      <i class="ri-add-line align-bottom me-1"></i> Add New
                      Agent
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header border-0">
                    <div class="row g-4 align-items-center">
                      <div class="col-sm-3">
                        <div class="search-box">
                          <input
                            type="text"
                            class="form-control"
                            placeholder="Search agents..."
                          />
                          <i class="ri-search-line search-icon"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive table-card">
                      <table
                        class="table align-middle table-nowrap mb-0"
                        id="agentTable"
                      >
                        <thead class="table-light">
                          <tr>
                            <th>No</th>
                            <th>Agent ID</th>
                            <th>Full Name</th>
                            <th>Contact No</th>
                            <th>Number of Referrals</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="6" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">© CSA.</div>
              <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                  Design & Develop by Epic Unicorn
                </div>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- Referrals Modal -->
    <div
      class="modal fade"
      id="referralsModal"
      tabindex="-1"
      aria-labelledby="referralsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="referralsModalLabel">Referrals</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="referralsModalBody">
              <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>

    <script>
      $(document).ready(function () {
        loadAgents();
      });

      async function loadAgents() {
        try {
          const agents = await apiCall("/admin/agents", "GET");
          const tbody = $("#agentTable tbody");
          tbody.empty();

          if (agents.length === 0) {
            tbody.append(
              '<tr><td colspan="6" class="text-center">No agent applications found</td></tr>',
            );
            return;
          }

          agents.forEach((agent, index) => {
            tbody.append(`
                        <tr>
                            <td>${index + 1}</td>
                            <td>${agent.memberCode}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <h5 class="fs-14 mb-1">${agent.firstName} ${agent.lastName}</h5>
                                    </div>
                                </div>
                            </td>
                            <td>${agent.phoneNumber}</td>
                            <td>${agent.referralAmount || 0}</td>
                            <td>
                                <button type="button" class="btn btn-soft-primary btn-sm view-referrals-btn" 
                                    data-agent-id="${agent._id}" 
                                    data-agent-name="${agent.firstName} ${agent.lastName}">
                                    <i class="ri-team-line align-bottom me-1"></i> View Referral
                                </button>
                            </td>
                        </tr>
                    `);
          });

          // Attach View Referrals handler
          $("#agentTable").on(
            "click",
            ".view-referrals-btn",
            async function () {
              const agentId = $(this).data("agent-id");
              const agentName = $(this).data("agent-name");
              $("#referralsModalLabel").text(`Referrals - ${agentName}`);
              $("#referralsModalBody").html(
                '<div class="text-center"><div class="spinner-border text-primary" role="status"></div></div>',
              );
              $("#referralsModal").modal("show");

              try {
                const referrals = await apiCall(
                  `/admin/agents/${agentId}/referrals`,
                  "GET",
                );
                if (!referrals || referrals.length === 0) {
                  $("#referralsModalBody").html(
                    '<p class="text-muted text-center">No referrals found for this agent.</p>',
                  );
                  return;
                }
                let rows = referrals
                  .map((r, i) => {
                    let statusBadge = "";
                    switch (r.status) {
                      case 1:
                        statusBadge =
                          '<span class="badge bg-warning">Pending</span>';
                        break;
                      case 2:
                        statusBadge =
                          '<span class="badge bg-success">Active</span>';
                        break;
                      case 3:
                        statusBadge =
                          '<span class="badge bg-danger">Inactive</span>';
                        break;
                      default:
                        statusBadge =
                          '<span class="badge bg-secondary">Unknown</span>';
                        break;
                    }
                    return `
                <tr>
                  <td>${i + 1}</td>
                  <td>${r.memberCode || "N/A"}</td>
                  <td>${r.firstName} ${r.lastName}</td>
                  <td>${r.phoneNumber || "N/A"}</td>
                  <td>${r.memberType === 2 ? "Agent" : "Member"}</td>
                  <td>${statusBadge}</td>
                  <td>${new Date(r.createDate).toLocaleDateString()}</td>
                </tr>`;
                  })
                  .join("");
                $("#referralsModalBody").html(`
                <table class="table table-sm table-bordered align-middle">
                  <thead class="table-light">
                    <tr>
                      <th>No</th><th>Agent ID</th><th>Full Name</th><th>Contact</th><th>Type</th><th>Status</th><th>Joined</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>`);
              } catch (e) {
                $("#referralsModalBody").html(
                  '<p class="text-danger text-center">Failed to load referrals.</p>',
                );
              }
            },
          );
        } catch (err) {
          console.error("Error loading agents:", err);
          $("#agentTable tbody").html(
            '<tr><td colspan="6" class="text-center text-danger">Error loading agent data</td></tr>',
          );
        }
      }
    </script>
  </body>
</html>

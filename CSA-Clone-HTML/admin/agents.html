<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent List | Admin Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Agent List</h4>
                  </div>
                  <div class="mt-3 mt-lg-0 d-flex gap-2">
                    <button type="button" class="btn btn-soft-success" id="btnExportAgentCSV">
                      <i class="ri-download-2-line align-bottom me-1"></i> Export CSV
                    </button>
                    <button type="button" class="btn btn-primary">
                      <i class="ri-add-line align-bottom me-1"></i> Add New
                      Agent
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header border-0">
                    <div class="row g-4 align-items-center">
                      <div class="col-sm-3">
                        <div class="search-box">
                          <input
                            type="text"
                            class="form-control"
                            id="searchAgent"
                            placeholder="Search agents..."
                          />
                          <i class="ri-search-line search-icon"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive table-card">
                      <table
                        class="table align-middle table-nowrap mb-0"
                        id="agentTable"
                      >
                        <thead class="table-light">
                          <tr>
                            <th>No</th>
                            <th>Agent ID</th>
                            <th>Full Name</th>
                            <th>Contact No</th>
                            <th>Assigned Subadmin</th>
                            <th>Number of Referrals</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="7" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer"></footer>
      </div>
    </div>

    <!-- Assign Subadmin Modal -->
    <div class="modal fade" id="assignSubadminModal" tabindex="-1" aria-labelledby="assignSubadminModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="assignSubadminModalLabel">Assign Agent to Subadmin</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="assignSubadminForm">
            <input type="hidden" id="assignAgentId" />
            <div class="modal-body">
              <p class="text-muted mb-3" id="assignAgentNameText"></p>
              <div class="mb-3">
                <label for="subadminSelect" class="form-label">Select Subadmin</label>
                <select class="form-select" id="subadminSelect" required>
                  <option value="">Loading subadmins...</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Assignment</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Referrals Modal -->
    <div
      class="modal fade"
      id="referralsModal"
      tabindex="-1"
      aria-labelledby="referralsModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="referralsModalLabel">Referrals</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div id="referralsModalBody">
              <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>
    <script src="../assets/libs/datatables/datatables.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>
    <script src="../Scripts/agentExportHelper.js"></script>

    <script>
      $(document).ready(function () {
        loadAgents();
        AgentExportHelper.init();
      });

      let subadminList = [];

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function loadAgents() {
        try {
          const userRole = localStorage.getItem("userRole") || "admin";
          const agents = await apiCall("/admin/agents", "GET");
          const tbody = $("#agentTable tbody");
          tbody.empty();

          if (!agents || agents.length === 0) {
            tbody.append(
              '<tr><td colspan="7" class="text-center">No agent applications found</td></tr>',
            );
            return;
          }

          agents.forEach((agent, index) => {
            const subadminBadge = agent.subadmin && agent.subadmin.name
              ? `<span class="badge bg-info-subtle text-info fs-12 px-2 py-1">${agent.subadmin.name}</span>`
              : `<span class="badge bg-light text-muted fs-12 px-2 py-1">Unassigned</span>`;

            let assignBtn = "";
            if (userRole !== "subadmin") {
              const currentSubId = agent.subadmin ? agent.subadmin._id || agent.subadmin : "";
              const safeAgentName = escapeHtml(agent.fullName || "");
              assignBtn = `
                <button type="button" class="btn btn-soft-secondary btn-sm assign-subadmin-btn"
                  data-agent-id="${agent._id}"
                  data-agent-name="${safeAgentName}"
                  data-current-sub-id="${currentSubId}">
                  <i class="ri-user-shared-line align-bottom me-1"></i> Assign Subadmin
                </button>
              `;
            }

            tbody.append(`
                        <tr>
                            <td>${index + 1}</td>
                            <td>${agent.memberCode || ''}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <h5 class="fs-14 mb-1">${agent.fullName || ''}</h5>
                                </div>
                            </td>
                            <td>${agent.phoneNumber || ''}</td>
                            <td>${subadminBadge}</td>
                            <td>${agent.referralAmount || 0}</td>
                            <td>
                                <div class="d-flex gap-2">
                                  <button type="button" class="btn btn-soft-primary btn-sm view-referrals-btn" 
                                      data-agent-id="${agent._id}" 
                                      data-agent-name="${escapeHtml(agent.fullName || '')}">
                                      <i class="ri-team-line align-bottom me-1"></i> View Referral
                                  </button>
                                  ${assignBtn}
                                </div>
                            </td>
                        </tr>
                    `);
          });

          if ($.fn.DataTable.isDataTable("#agentTable")) {
            $("#agentTable").DataTable().destroy();
          }

          const agentTable = $("#agentTable").DataTable({
            dom: 'rt<"row mt-3"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
            pageLength: 100,
            ordering: true,
            language: {
              emptyTable: "No agent applications found"
            }
          });

          $("#searchAgent").off("keyup input").on("keyup input", function () {
            agentTable.search($(this).val()).draw();
          });

          if ($("#searchAgent").val()) {
            agentTable.search($("#searchAgent").val()).draw();
          }

          // Attach Assign Subadmin handler
          $("#agentTable").off("click", ".assign-subadmin-btn").on(
            "click",
            ".assign-subadmin-btn",
            function () {
              const agentId = $(this).attr("data-agent-id");
              const agentName = $(this).attr("data-agent-name");
              const currentSubId = $(this).attr("data-current-sub-id");
              openAssignModal(agentId, agentName, currentSubId);
            }
          );

          // App status map matching admin/members.html
          const appStatusMap = {
            0: { text: "Pending (Unassigned)", class: "bg-light text-dark" },
            1: { text: "Pending (Pre-checking)", class: "bg-info" },
            2: { text: "Pending (Proposal Prep)", class: "bg-warning" },
            3: { text: "Pending (Proposal Pres)", class: "bg-primary" },
            4: { text: "Pending (Pre-Signing)", class: "bg-secondary" },
            5: { text: "Pending Acceptance", class: "bg-info" },
            6: { text: "Approved", class: "bg-success" },
            7: { text: "Monitoring", class: "bg-dark" },
            8: { text: "Queue For Reloan", class: "bg-light text-dark" },
            9: { text: "Reloan Submission", class: "bg-primary" },
            10: { text: "Rejected", class: "bg-danger" },
          };

          // Attach View Referrals handler
          $("#agentTable").on(
            "click",
            ".view-referrals-btn",
            async function () {
              const agentId = $(this).data("agent-id");
              const agentName = $(this).data("agent-name");
              $("#referralsModalLabel").text(`Referrals - ${agentName}`);
              $("#referralsModalBody").html(
                '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>',
              );
              $("#referralsModal").modal("show");

              try {
                const referrals = await apiCall(
                  `/admin/agents/${agentId}/referrals`,
                  "GET",
                );
                if (!referrals || referrals.length === 0) {
                  $("#referralsModalBody").html(
                    '<p class="text-muted text-center py-4">No referrals found for this agent.</p>',
                  );
                  return;
                }

                const notUploadedCount = referrals.filter(
                  (r) => r.latestAppStatus === null || r.latestAppStatus === undefined,
                ).length;

                let modalHtml = `
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                  <div class="hstack gap-2">
                    <span class="badge bg-danger-subtle text-danger fs-12 px-2 py-1">
                      <i class="ri-error-warning-line me-1"></i>${notUploadedCount} Not Uploaded Document
                    </span>
                    <span class="badge bg-primary-subtle text-primary fs-12 px-2 py-1">
                      Total: ${referrals.length}
                    </span>
                  </div>
                  <div class="d-flex gap-2">
                    <select id="modalRefFilter" class="form-select form-select-sm" style="min-width: 170px;">
                      <option value="all">All Referrals (${referrals.length})</option>
                      <option value="no_app">Not Uploaded / No Application (${notUploadedCount})</option>
                      <option value="has_app">Application Submitted (${referrals.length - notUploadedCount})</option>
                    </select>
                    <input type="text" id="modalRefSearch" class="form-control form-control-sm" placeholder="Search member..." style="width: 160px;">
                  </div>
                </div>
                <div class="table-responsive">
                  <table class="table table-sm table-hover table-bordered align-middle mb-0" id="referralsModalTable">
                    <thead class="table-light">
                      <tr>
                        <th>No</th>
                        <th>File Number</th>
                        <th>Full Name</th>
                        <th>Contact</th>
                        <th>Type</th>
                        <th>App / Document Status</th>
                        <th>Account</th>
                        <th>Joined</th>
                      </tr>
                    </thead>
                    <tbody>`;

                referrals.forEach((r, i) => {
                  let accountBadge = "";
                  switch (r.status) {
                    case "pending":
                    case 1:
                    case "1":
                      accountBadge = '<span class="badge bg-warning-subtle text-warning">Pending</span>';
                      break;
                    case "approved":
                    case 2:
                    case "2":
                      accountBadge = '<span class="badge bg-success-subtle text-success">Active</span>';
                      break;
                    case "rejected":
                    case 3:
                    case "3":
                      accountBadge = '<span class="badge bg-danger-subtle text-danger">Inactive</span>';
                      break;
                    default:
                      accountBadge = '<span class="badge bg-secondary-subtle text-secondary">Unknown</span>';
                      break;
                  }

                  const appStatus =
                    r.latestAppStatus !== null && r.latestAppStatus !== undefined && appStatusMap[r.latestAppStatus]
                      ? appStatusMap[r.latestAppStatus]
                      : { text: "No Application", class: "bg-secondary-subtle text-secondary" };

                  const hasAppStr = r.latestAppStatus !== null && r.latestAppStatus !== undefined ? "has_app" : "no_app";

                  modalHtml += `
                    <tr data-has-app="${hasAppStr}" data-search="${(r.fullName + " " + (r.memberCode || "") + " " + (r.phoneNumber || "")).toLowerCase()}">
                      <td>${i + 1}</td>
                      <td>${r.memberCode || "N/A"}</td>
                      <td class="fw-medium">${r.fullName}</td>
                      <td>${r.phoneNumber || "N/A"}</td>
                      <td>${r.memberType === 2 ? "Agent" : "Member"}</td>
                      <td><span class="badge ${appStatus.class}">${appStatus.text}</span></td>
                      <td>${accountBadge}</td>
                      <td>${new Date(r.createDate).toLocaleDateString()}</td>
                    </tr>`;
                });

                modalHtml += `
                    </tbody>
                  </table>
                </div>`;

                $("#referralsModalBody").html(modalHtml);

                // Attach modal filter & search logic
                function filterModalRows() {
                  const filterVal = $("#modalRefFilter").val();
                  const searchVal = $("#modalRefSearch").val().toLowerCase().trim();

                  $("#referralsModalTable tbody tr").each(function () {
                    const rowHasApp = $(this).attr("data-has-app");
                    const rowSearch = $(this).attr("data-search");

                    const matchesFilter =
                      filterVal === "all" ||
                      (filterVal === "no_app" && rowHasApp === "no_app") ||
                      (filterVal === "has_app" && rowHasApp === "has_app");

                    const matchesSearch = !searchVal || rowSearch.includes(searchVal);

                    if (matchesFilter && matchesSearch) {
                      $(this).show();
                    } else {
                      $(this).hide();
                    }
                  });
                }

                $("#modalRefFilter, #modalRefSearch").on("change keyup", filterModalRows);

              } catch (e) {
                console.error("Referrals modal error:", e);
                $("#referralsModalBody").html(
                  '<p class="text-danger text-center py-4">Failed to load referrals.</p>',
                );
              }
            },
          );
        } catch (err) {
          console.error("Error loading agents:", err);
          $("#agentTable tbody").html(
            '<tr><td colspan="7" class="text-center text-danger">Error loading agent data</td></tr>',
          );
        }
      }

      async function openAssignModal(agentId, agentName, currentSubadminId) {
        $("#assignAgentId").val(agentId);
        $("#assignAgentNameText").text(`Assign Subadmin for Agent: ${agentName}`);
        $("#subadminSelect").html('<option value="">Loading subadmins...</option>');
        $("#assignSubadminModal").modal("show");

        try {
          subadminList = await apiCall("/admin/subadmins", "GET");
          let options = '<option value="unassign">-- Unassigned --</option>';
          if (subadminList && subadminList.length > 0) {
            subadminList.forEach((sub) => {
              const selected = sub._id === currentSubadminId ? "selected" : "";
              options += `<option value="${sub._id}" ${selected}>${sub.name} (${sub.email})</option>`;
            });
          }
          $("#subadminSelect").html(options);
        } catch (err) {
          console.error("Error fetching subadmins:", err);
          $("#subadminSelect").html('<option value="">Failed to load subadmins</option>');
        }
      }

      $("#assignSubadminForm").on("submit", async function (e) {
        e.preventDefault();
        const agentId = $("#assignAgentId").val();
        const subadminId = $("#subadminSelect").val();

        try {
          const res = await apiCall(`/admin/agent/${agentId}/assign-subadmin`, "POST", { subadminId });
          if (res) {
            alert("Agent assigned to subadmin successfully!");
            $("#assignSubadminModal").modal("hide");
            loadAgents();
          }
        } catch (err) {
          console.error("Error assigning subadmin:", err);
          alert("Error assigning agent to subadmin.");
        }
      });
    </script>
  </body>
</html>

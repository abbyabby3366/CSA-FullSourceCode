<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent List | Admin Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <!-- datatables css -->
    <link
      href="../assets/libs/datatables/datatables.min.css"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="../assets/images/logos/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Agent List</h4>
                  </div>
                  <div class="mt-3 mt-lg-0">
                    <button type="button" class="btn btn-primary">
                      <i class="ri-add-line align-bottom me-1"></i> Add New
                      Agent
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header border-0">
                    <div class="row g-4 align-items-center">
                      <div class="col-sm-3">
                        <div class="search-box">
                          <input
                            type="text"
                            class="form-control"
                            placeholder="Search agents..."
                          />
                          <i class="ri-search-line search-icon"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive table-card">
                      <table
                        class="table align-middle table-nowrap mb-0"
                        id="agentTable"
                      >
                        <thead class="table-light">
                          <tr>
                            <th>No</th>
                            <th>File Number</th>
                            <th>Full Name</th>
                            <th>Contact No</th>
                            <th>State</th>
                            <th>Sector</th>
                            <th>Referrals</th>
                            <th>Status</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="9" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">© CSA.</div>
              <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                  Design & Develop by Epic Unicorn
                </div>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>

    <script>
      $(document).ready(function () {
        loadAgents();
      });

      async function loadAgents() {
        try {
          const agents = await apiCall("/admin/agents", "GET");
          const tbody = $("#agentTable tbody");
          tbody.empty();

          if (agents.length === 0) {
            tbody.append(
              '<tr><td colspan="9" class="text-center">No agent applications found</td></tr>',
            );
            return;
          }

          agents.forEach((agent, index) => {
            let statusBadge = "";
            switch (agent.status) {
              case 0:
                statusBadge =
                  '<span class="badge bg-warning">Pending Approval</span>';
                break;
              case 1:
                statusBadge =
                  '<span class="badge bg-info">Waiting Approval</span>';
                break;
              case 2:
                statusBadge = '<span class="badge bg-success">Active</span>';
                break;
              case 3:
                statusBadge = '<span class="badge bg-danger">Inactive</span>';
                break;
              default:
                statusBadge = `<span class="badge bg-secondary">Unknown (${agent.status})</span>`;
            }

            tbody.append(`
                        <tr>
                            <td>${index + 1}</td>
                            <td>${agent.memberCode}</td>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <h5 class="fs-14 mb-1">${agent.firstName} ${agent.lastName}</h5>
                                        <p class="text-muted mb-0">${agent.email || "-"}</p>
                                    </div>
                                </div>
                            </td>
                            <td>${agent.phoneNumber}</td>
                            <td>${agent.state || "-"}</td>
                            <td>${agent.occupation || "-"}</td>
                            <td>${agent.referralAmount || 0}</td>
                            <td>${statusBadge}</td>
                            <td>
                                <div class="dropdown d-inline-block">
                                    <button class="btn btn-soft-secondary btn-sm dropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="ri-more-fill align-middle"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li><a href="#!" class="dropdown-item"><i class="ri-eye-fill align-bottom me-2 text-muted"></i> View Details</a></li>
                                        <li><a class="dropdown-item edit-item-btn"><i class="ri-pencil-fill align-bottom me-2 text-muted"></i> Edit</a></li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                    `);
          });
        } catch (err) {
          console.error("Error loading agents:", err);
          $("#agentTable tbody").html(
            '<tr><td colspan="9" class="text-center text-danger">Error loading agent data</td></tr>',
          );
        }
      }
    </script>
  </body>
</html>

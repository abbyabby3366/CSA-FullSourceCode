<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subadmin Management | Admin Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />
    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />
    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />
    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />
    <!-- datatables css -->
    <link href="../assets/libs/datatables/datatables.min.css" rel="stylesheet" type="text/css" />
    <link href="../assets/images/logos/favicon.ico" rel="shortcut icon" type="image/x-icon" />
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div class="d-flex align-items-lg-center flex-lg-row flex-column">
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Subadmin User Management</h4>
                    <p class="text-muted mb-0">Create and manage subadmin accounts with restricted portal permissions.</p>
                  </div>
                  <div class="mt-3 mt-lg-0">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSubadminModal">
                      <i class="ri-add-line align-bottom me-1"></i> Add New Subadmin
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-12">
                <div class="card">
                  <div class="card-header border-0">
                    <div class="row g-4 align-items-center">
                      <div class="col-sm-4">
                        <div class="search-box">
                          <input type="text" class="form-control" id="searchSubadmin" placeholder="Search subadmins..." />
                          <i class="ri-search-line search-icon"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive table-card">
                      <table class="table align-middle table-nowrap mb-0" id="subadminTable">
                        <thead class="table-light">
                          <tr>
                            <th>No</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Create Date</th>
                            <th class="text-center">Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="6" class="text-center">
                              <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">© iBelanja.</div>
              <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">Design & Develop by Epic Unicorn</div>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- Add Subadmin Modal -->
    <div class="modal fade" id="addSubadminModal" tabindex="-1" aria-labelledby="addSubadminModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addSubadminModalLabel">Add New Subadmin</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="addSubadminForm">
            <div class="modal-body">
              <div class="mb-3">
                <label for="subadminName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="subadminName" placeholder="Enter name" required />
              </div>
              <div class="mb-3">
                <label for="subadminEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="subadminEmail" placeholder="Enter email" required />
              </div>
              <div class="mb-3">
                <label for="subadminPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="subadminPassword" placeholder="Enter password" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Create Subadmin</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Subadmin Modal -->
    <div class="modal fade" id="editSubadminModal" tabindex="-1" aria-labelledby="editSubadminModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editSubadminModalLabel">Edit Subadmin</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="editSubadminForm">
            <input type="hidden" id="editSubadminId" />
            <div class="modal-body">
              <div class="mb-3">
                <label for="editSubadminName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="editSubadminName" required />
              </div>
              <div class="mb-3">
                <label for="editSubadminEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="editSubadminEmail" required />
              </div>
              <div class="mb-3">
                <label for="editSubadminPassword" class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" class="form-control" id="editSubadminPassword" placeholder="Optional" />
              </div>
              <div class="mb-3">
                <label for="editSubadminStatus" class="form-label">Status</label>
                <select class="form-select" id="editSubadminStatus">
                  <option value="1">Active</option>
                  <option value="2">Inactive</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>
    <script src="../assets/libs/datatables/datatables.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../Scripts/adminHelper.js"></script>

    <script>
      let subadminsData = [];

      $(document).ready(function () {
        loadSubadmins();

        // Add Subadmin Form Submit
        $("#addSubadminForm").on("submit", async function (e) {
          e.preventDefault();
          const name = $("#subadminName").val();
          const email = $("#subadminEmail").val();
          const password = $("#subadminPassword").val();

          try {
            const res = await apiCall("/admin/subadmins", "POST", { name, email, password });
            if (res && res._id) {
              alert("Subadmin created successfully!");
              $("#addSubadminModal").modal("hide");
              $("#addSubadminForm")[0].reset();
              loadSubadmins();
            } else {
              alert(res.msg || "Failed to create subadmin");
            }
          } catch (err) {
            console.error("Error creating subadmin:", err);
            alert("Error creating subadmin.");
          }
        });

        // Edit Subadmin Form Submit
        $("#editSubadminForm").on("submit", async function (e) {
          e.preventDefault();
          const id = $("#editSubadminId").val();
          const name = $("#editSubadminName").val();
          const email = $("#editSubadminEmail").val();
          const password = $("#editSubadminPassword").val();
          const status = parseInt($("#editSubadminStatus").val());

          const body = { name, email, status };
          if (password) body.password = password;

          try {
            const res = await apiCall(`/admin/subadmin/${id}`, "PUT", body);
            if (res && res._id) {
              alert("Subadmin updated successfully!");
              $("#editSubadminModal").modal("hide");
              loadSubadmins();
            } else {
              alert(res.msg || "Failed to update subadmin");
            }
          } catch (err) {
            console.error("Error updating subadmin:", err);
            alert("Error updating subadmin.");
          }
        });

        // Search Box
        $("#searchSubadmin").on("keyup", function () {
          const val = $(this).val().toLowerCase();
          $("#subadminTable tbody tr").each(function () {
            const text = $(this).text().toLowerCase();
            $(this).toggle(text.indexOf(val) > -1);
          });
        });
      });

      async function loadSubadmins() {
        try {
          subadminsData = await apiCall("/admin/subadmins");
          const tbody = $("#subadminTable tbody");
          tbody.empty();

          if (!subadminsData || subadminsData.length === 0) {
            tbody.append('<tr><td colspan="6" class="text-center">No subadmins found</td></tr>');
            return;
          }

          subadminsData.forEach((s, idx) => {
            const statusBadge = s.status === 1
              ? '<span class="badge bg-success-subtle text-success">Active</span>'
              : '<span class="badge bg-danger-subtle text-danger">Inactive</span>';

            const created = s.createDate ? new Date(s.createDate).toLocaleDateString() : "N/A";

            tbody.append(`
              <tr>
                <td>${idx + 1}</td>
                <td class="fw-medium">${s.name}</td>
                <td>${s.email}</td>
                <td>${statusBadge}</td>
                <td>${created}</td>
                <td class="text-center">
                  <div class="hstack gap-2 justify-content-center">
                    <button class="btn btn-sm btn-soft-primary" onclick="openEditModal('${s._id}')">Edit</button>
                    <button class="btn btn-sm btn-soft-danger" onclick="deleteSubadmin('${s._id}')">Delete</button>
                  </div>
                </td>
              </tr>
            `);
          });
        } catch (err) {
          console.error("Error loading subadmins:", err);
          $("#subadminTable tbody").html('<tr><td colspan="6" class="text-center text-danger">Error loading subadmins</td></tr>');
        }
      }

      function openEditModal(id) {
        const sub = subadminsData.find((s) => s._id === id);
        if (!sub) return;

        $("#editSubadminId").val(sub._id);
        $("#editSubadminName").val(sub.name);
        $("#editSubadminEmail").val(sub.email);
        $("#editSubadminPassword").val("");
        $("#editSubadminStatus").val(sub.status || 1);
        $("#editSubadminModal").modal("show");
      }

      async function deleteSubadmin(id) {
        if (!confirm("Are you sure you want to delete this subadmin account? Assigned agents will be unassigned.")) return;
        try {
          const res = await apiCall(`/admin/subadmin/${id}`, "DELETE");
          if (res) {
            alert("Subadmin deleted successfully.");
            loadSubadmins();
          }
        } catch (err) {
          console.error("Error deleting subadmin:", err);
          alert("Error deleting subadmin.");
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html
  lang="en"
  data-layout="vertical"
  data-topbar="light"
  data-sidebar="dark"
  data-sidebar-size="lg"
  data-sidebar-image="none"
  data-preloader="disable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Management | Admin Portal</title>

    <script src="../assets/js/layout.js"></script>

    <!-- bootstrap css -->
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />

    <!-- font css -->
    <link rel="stylesheet" href="../assets/css/icons.min.css" />

    <!-- app css -->
    <link rel="stylesheet" href="../assets/css/app.min.css" />

    <!-- custom css -->
    <link rel="stylesheet" href="../assets/css/custom.css" />

    <link
      href="../assets/images/favicon.ico"
      rel="shortcut icon"
      type="image/x-icon"
    />

    <style>
      .carousel-item-preview {
        max-width: 200px;
        max-height: 120px;
        object-fit: cover;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="layout-wrapper">
      <!-- page header -->
      <header id="page-topbar"></header>

      <div class="app-menu navbar-menu"></div>

      <div class="vertical-overlay"></div>

      <div class="main-content">
        <div class="page-content">
          <div class="container-fluid">
            <!-- page header -->
            <div class="row mb-3 pb-1">
              <div class="col-12">
                <div
                  class="d-flex align-items-lg-center flex-lg-row flex-column"
                >
                  <div class="flex-grow-1">
                    <h4 class="fs-16 mb-1">Dashboard Images</h4>
                    <p class="text-muted mb-0">
                      Manage the images displayed in the member dashboard
                      carousel.
                    </p>
                  </div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-lg-4">
                <div class="card">
                  <div class="card-header">
                    <h5 class="card-title mb-0">Upload New Image</h5>
                  </div>
                  <div class="card-body">
                    <form id="uploadForm" enctype="multipart/form-data">
                      <div class="mb-3">
                        <label class="form-label">Select Image</label>
                        <input
                          type="file"
                          class="form-control"
                          name="image"
                          accept="image/*"
                          required
                        />
                        <small class="text-muted"
                          >Recommended size: 1200x300 (4:1 ratio for optimal
                          fit)</small
                        >
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Title (Optional)</label>
                        <input
                          type="text"
                          class="form-control"
                          name="title"
                          placeholder="Enter image title"
                        />
                      </div>
                      <div class="mb-3">
                        <label class="form-label">Display Order</label>
                        <input
                          type="number"
                          class="form-control"
                          name="order"
                          value="0"
                        />
                      </div>
                      <button
                        type="submit"
                        class="btn btn-primary w-100"
                        id="uploadBtn"
                      >
                        <span
                          class="spinner-border spinner-border-sm d-none"
                          role="status"
                          aria-hidden="true"
                        ></span>
                        Upload Image
                      </button>
                    </form>
                  </div>
                </div>
              </div>
              <div class="col-lg-8">
                <div class="card">
                  <div class="card-header">
                    <h5 class="card-title mb-0">Existing Carousel Images</h5>
                  </div>
                  <div class="card-body">
                    <div class="table-responsive">
                      <table class="table table-nowrap align-middle mb-0">
                        <thead class="table-light">
                          <tr>
                            <th scope="col">Preview</th>
                            <th scope="col">Title</th>
                            <th scope="col">Order</th>
                            <th scope="col">Action</th>
                          </tr>
                        </thead>
                        <tbody id="carouselTableBody">
                          <tr>
                            <td colspan="4" class="text-center">
                              <div
                                class="spinner-border text-primary"
                                role="status"
                              >
                                <span class="visually-hidden">Loading...</span>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <div id="noData" class="text-center py-4 d-none">
                      <i class="ri-image-line fs-48 text-muted"></i>
                      <p class="mt-2 text-muted">
                        No images found. Please upload some.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="footer"></footer>
      </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../assets/libs/jquery/js/jquery-3.6.3.min.js"></script>
    <script src="../Scripts/config.js"></script>
    <script src="../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/libs/simplebar/simplebar.min.js"></script>
    <script src="../assets/libs/node-waves/waves.min.js"></script>
    <script src="../assets/libs/feather-icons/feather.min.js"></script>
    <script src="../assets/js/pages/plugins/lord-icon-2.1.0.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../Scripts/navbar.js"></script>

    <script>
      $(document).ready(function () {
        loadCarouselImages();

        $("#uploadForm").on("submit", async function (e) {
          e.preventDefault();
          const formData = new FormData(this);
          const btn = $("#uploadBtn");
          const spinner = btn.find(".spinner-border");

          btn.prop("disabled", true);
          spinner.removeClass("d-none");

          try {
            const response = await fetch(
              `${window.API_BASE_URL}/api/carousel`,
              {
                method: "POST",
                headers: {
                  "x-auth-token": localStorage.getItem("token"),
                },
                body: formData,
              },
            );

            const data = await response.json();
            if (response.ok) {
              alert("Image uploaded successfully!");
              this.reset();
              loadCarouselImages();
            } else {
              alert(data.msg || "Upload failed");
            }
          } catch (err) {
            console.error("Upload Error:", err);
            alert("An error occurred during upload");
          } finally {
            btn.prop("disabled", false);
            spinner.addClass("d-none");
          }
        });
      });

      async function loadCarouselImages() {
        try {
          const response = await fetch(`${window.API_BASE_URL}/api/carousel`);
          const images = await response.json();

          const tbody = $("#carouselTableBody");
          tbody.empty();

          if (images.length === 0) {
            $("#noData").removeClass("d-none");
          } else {
            $("#noData").addClass("d-none");
            images.forEach((img) => {
              tbody.append(`
                            <tr>
                                <td><img src="${img.imageUrl}" class="carousel-item-preview" alt=""></td>
                                <td>${img.title || "N/A"}</td>
                                <td>${img.order}</td>
                                <td>
                                    <button class="btn btn-sm btn-soft-danger" onclick="deleteImage('${img._id}')">
                                        <i class="ri-delete-bin-line"></i>
                                    </button>
                                </td>
                            </tr>
                        `);
            });
          }
        } catch (err) {
          console.error("Error loading images:", err);
        }
      }

      async function deleteImage(id) {
        if (!confirm("Are you sure you want to delete this image?")) return;

        try {
          const response = await fetch(
            `${window.API_BASE_URL}/api/carousel/${id}`,
            {
              method: "DELETE",
              headers: {
                "x-auth-token": localStorage.getItem("token"),
              },
            },
          );

          if (response.ok) {
            alert("Image deleted");
            loadCarouselImages();
          } else {
            const data = await response.json();
            alert(data.msg || "Delete failed");
          }
        } catch (err) {
          console.error("Delete Error:", err);
          alert("An error occurred during deletion");
        }
      }
    </script>
  </body>
</html>
